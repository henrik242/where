<IfModule mod_ssl.c>
<VirtualHost *:443>
    ServerAdmin webmaster@example.com
    ServerName where.example.com

    # Enable required modules: proxy, proxy_http, proxy_wstunnel
    # Run: sudo a2enmod proxy proxy_http proxy_wstunnel

    # Proxy to Bun server
    ProxyPreserveHost On
    ProxyRequests Off

    # WebSocket support — only the /ws endpoint is tunnelled.
    RewriteEngine On
    RewriteCond %{HTTP:Upgrade} websocket [NC]
    RewriteCond %{HTTP:Connection} upgrade [NC]
    RewriteRule ^/ws$ "ws://localhost:3000/ws" [P,L]

    # Regular HTTP proxy
    ProxyPass / http://localhost:3000/
    ProxyPassReverse / http://localhost:3000/

    # Logging
    ErrorLog /var/log/apache2/where-error.log
    CustomLog /var/log/apache2/where-access.log combined

    # SSL Configuration — set CERT_LINEAGE to the certbot lineage on the host
    # (ls /etc/letsencrypt/live/), e.g. example.com or example.com-0001.
    Include /etc/letsencrypt/options-ssl-apache.conf
    SSLCertificateFile /etc/letsencrypt/live/CERT_LINEAGE/fullchain.pem
    SSLCertificateKeyFile /etc/letsencrypt/live/CERT_LINEAGE/privkey.pem
</VirtualHost>
</IfModule>
