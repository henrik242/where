name: Release macOS desktop

permissions:
  contents: write

on:
  workflow_dispatch:

concurrency:
  group: release-desktop
  cancel-in-progress: false

jobs:
  release:
    runs-on: macos-26
    environment: production
    env:
      LANG: en_US.UTF-8
      LC_ALL: en_US.UTF-8
      KEYCHAIN: ${{ github.workspace }}/../signing.keychain-db

    steps:
    - name: Checkout code
      uses: actions/checkout@v7
      with:
        # Full history: the version is the commit count.
        fetch-depth: 0

    - name: Compute version tag
      id: version
      run: |
        VERSION_TAG="v$(git rev-list --count HEAD)"
        SHORT_SHA=$(git rev-parse --short HEAD)
        echo "tag=$VERSION_TAG" >> "$GITHUB_OUTPUT"
        echo "Version tag: $VERSION_TAG ($SHORT_SHA)"
        echo "### macOS desktop release $VERSION_TAG" >> "$GITHUB_STEP_SUMMARY"
        echo "Commit \`$SHORT_SHA\`" >> "$GITHUB_STEP_SUMMARY"

    - name: Validate secrets
      env:
        TRACKING_HINT: ${{ secrets.TRACKING_HINT }}
        GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        DEVELOPER_ID_CERTIFICATE_BASE64: ${{ secrets.DEVELOPER_ID_CERTIFICATE_BASE64 }}
        DEVELOPER_ID_CERTIFICATE_PASSWORD: ${{ secrets.DEVELOPER_ID_CERTIFICATE_PASSWORD }}
        ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
        ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        ASC_KEY_CONTENT: ${{ secrets.ASC_KEY_CONTENT }}
      run: |
        v=".github/verify-secret.sh"
        $v nonempty TRACKING_HINT
        $v json GOOGLE_SERVICES_JSON
        $v p12 DEVELOPER_ID_CERTIFICATE_BASE64 "$DEVELOPER_ID_CERTIFICATE_PASSWORD"
        $v nonempty ASC_KEY_ID
        $v nonempty ASC_ISSUER_ID
        $v p8 ASC_KEY_CONTENT

    - name: Set up JDK 21
      uses: actions/setup-java@v6
      with:
        distribution: temurin
        java-version: '21'

    - name: Set up Gradle
      uses: gradle/actions/setup-gradle@v6.3.0
      with:
        cache-provider: basic

    # :desktop:packageDmg configures the whole build graph, including the Android :app module, so
    # the SDK location and the shared tracking hint must be present.
    - name: Create local.properties
      env:
        TRACKING_HINT: ${{ secrets.TRACKING_HINT }}
      run: |
        echo "sdk.dir=$ANDROID_HOME" > local.properties
        echo "TRACKING_HINT=$TRACKING_HINT" >> local.properties

    - name: Create google-services.json
      env:
        GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
      run: echo "$GOOGLE_SERVICES_JSON" | base64 -d > app/google-services.json

    - name: Run shared unit tests
      run: ./gradlew :shared:jvmTest

    # A throwaway keychain holding only the Developer ID, which codesign finds by name.
    - name: Import Developer ID certificate
      env:
        DEVELOPER_ID_CERTIFICATE_BASE64: ${{ secrets.DEVELOPER_ID_CERTIFICATE_BASE64 }}
        DEVELOPER_ID_CERTIFICATE_PASSWORD: ${{ secrets.DEVELOPER_ID_CERTIFICATE_PASSWORD }}
      run: |
        KEYCHAIN_PASSWORD=$(uuidgen)
        echo "$DEVELOPER_ID_CERTIFICATE_BASE64" | base64 -d > "$RUNNER_TEMP/developer-id.p12"
        security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
        security set-keychain-settings -lut 21600 "$KEYCHAIN"
        security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
        security import "$RUNNER_TEMP/developer-id.p12" -k "$KEYCHAIN" \
          -P "$DEVELOPER_ID_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
        security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
        security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')
        security find-identity -v -p codesigning "$KEYCHAIN"

    # The map renders through the Java FFM API and jpackage needs a full JDK 25; the Gradle
    # toolchain (foojay resolver) downloads BellSoft Liberica 25 as configured in :desktop.
    - name: Package signed DMG
      run: |
        ./gradlew :desktop:packageDmg \
          -Pcompose.desktop.mac.sign=true \
          "-Pcompose.desktop.mac.signing.identity=Henrik Aronsen" \
          "-Pcompose.desktop.mac.signing.keychain=$KEYCHAIN"
        DMG=$(ls desktop/build/compose/binaries/main/dmg/*.dmg)
        codesign --force --timestamp --sign "Developer ID Application: Henrik Aronsen" "$DMG"
        echo "DMG=$DMG" >> "$GITHUB_ENV"

    - name: Notarize and staple
      env:
        ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
        ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        ASC_KEY_CONTENT: ${{ secrets.ASC_KEY_CONTENT }}
      run: |
        echo "$ASC_KEY_CONTENT" | base64 -d > "$RUNNER_TEMP/AuthKey.p8"
        xcrun notarytool submit "$DMG" \
          --key "$RUNNER_TEMP/AuthKey.p8" --key-id "$ASC_KEY_ID" --issuer "$ASC_ISSUER_ID" \
          --wait --output-format json | tee "$RUNNER_TEMP/notary.json"
        if [ "$(jq -r .status "$RUNNER_TEMP/notary.json")" != "Accepted" ]; then
          xcrun notarytool log "$(jq -r .id "$RUNNER_TEMP/notary.json")" \
            --key "$RUNNER_TEMP/AuthKey.p8" --key-id "$ASC_KEY_ID" --issuer "$ASC_ISSUER_ID"
          exit 1
        fi
        xcrun stapler staple "$DMG"
        spctl --assess --type open --context context:primary-signature --verbose=2 "$DMG"

    - name: Upload DMG
      uses: actions/upload-artifact@v7
      with:
        name: release-dmg
        path: ${{ env.DMG }}
        if-no-files-found: error
        retention-days: 90

    - name: Create version tag and release ${{ steps.version.outputs.tag }}
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        VERSION_TAG="${{ steps.version.outputs.tag }}"
        OUT="$RUNNER_TEMP/Where-$VERSION_TAG.dmg"
        cp "$DMG" "$OUT"
        git tag "$VERSION_TAG" 2>/dev/null || true
        git push origin "$VERSION_TAG" 2>/dev/null || true
        gh release view "$VERSION_TAG" &>/dev/null && \
          gh release upload "$VERSION_TAG" "$OUT" --clobber || \
          gh release create "$VERSION_TAG" \
            --target "$(git rev-parse HEAD)" \
            --title "$VERSION_TAG" \
            --notes "Desktop release $VERSION_TAG" \
            "$OUT"

    - name: Cleanup secrets
      if: always()
      run: |
        security delete-keychain "$KEYCHAIN" 2>/dev/null || true
        rm -f "$RUNNER_TEMP/developer-id.p12" "$RUNNER_TEMP/AuthKey.p8" local.properties app/google-services.json
