name: Build Android

permissions:
  contents: read

on:
  push:
    branches: [ main, develop ]
    paths:
      - 'app/**'
      - 'shared/**'
      - 'gradle/**'
      - '*gradle*'
      - '.github/workflows/build-android.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'app/**'
      - 'shared/**'
      - 'gradle/**'
      - '*gradle*'
      - 'gradlew'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    environment: ${{ github.actor != 'dependabot[bot]' && 'production' || '' }}
    env:
      # The commit that was pushed, not github.sha: on a pull_request that is GitHub's own merge
      # commit, which exists on no branch, so a build stamped with it names a sha nobody can look
      # up. Job-wide so every Gradle invocation and the APK name agree on one answer.
      BUILD_GIT_SHA: ${{ github.event.pull_request.head.sha || github.sha }}

    steps:
    - name: Checkout code
      uses: actions/checkout@v7
      with:
        fetch-depth: 0

    - name: Set up JDK 21
      uses: actions/setup-java@v6
      with:
        java-version: '21'
        distribution: 'temurin'

    - name: Set up Gradle
      uses: gradle/actions/setup-gradle@v6
      with:
        cache-provider: basic

    - name: Validate secrets
      if: github.actor != 'dependabot[bot]'
      env:
        TRACKING_HINT: ${{ secrets.TRACKING_HINT }}
        DEBUG_KEYSTORE_BASE64: ${{ secrets.DEBUG_KEYSTORE_BASE64 }}
        DEBUG_STORE_PASSWORD: ${{ secrets.DEBUG_STORE_PASSWORD }}
        DEBUG_KEY_ALIAS: ${{ secrets.DEBUG_KEY_ALIAS }}
        DEBUG_KEY_PASSWORD: ${{ secrets.DEBUG_KEY_PASSWORD }}
      run: |
        if [ -z "$TRACKING_HINT" ]; then
          echo "ERROR: TRACKING_HINT is not set in GitHub secrets"
          exit 1
        fi
        for secret in DEBUG_KEYSTORE_BASE64 DEBUG_STORE_PASSWORD DEBUG_KEY_ALIAS DEBUG_KEY_PASSWORD; do
          if [ -z "${!secret}" ]; then
            echo "ERROR: $secret is not set in GitHub secrets."
            echo "Runners are ephemeral, so without a fixed debug keystore every run signs the APK"
            echo "with a freshly generated certificate and installing a CI APK over an earlier one"
            echo "fails with INSTALL_FAILED_UPDATE_INCOMPATIBLE. This is a hard failure rather than"
            echo "a fallback so the APKs never quietly drift apart."
            exit 1
          fi
        done

    - name: Create local.properties
      run: |
        echo "sdk.dir=$ANDROID_HOME" > local.properties
        echo "TRACKING_HINT=${{ github.actor != 'dependabot[bot]' && secrets.TRACKING_HINT || 'dependabot-dummy-tracking-hint' }}" >> local.properties

    - name: Create google-services.json
      run: |
        if [ "${{ github.actor }}" = "dependabot[bot]" ]; then
          cp .github/dummy/google-services-dummy.json app/google-services.json
        else
          echo "${{ secrets.GOOGLE_SERVICES_JSON }}" | base64 -d > app/google-services.json
        fi

    - name: Decode debug keystore
      if: github.actor != 'dependabot[bot]'
      env:
        DEBUG_KEYSTORE_BASE64: ${{ secrets.DEBUG_KEYSTORE_BASE64 }}
      run: echo "$DEBUG_KEYSTORE_BASE64" | base64 -d > /tmp/debug.jks

    - name: Build debug APK
      if: github.actor != 'dependabot[bot]'
      env:
        DEBUG_STORE_FILE: /tmp/debug.jks
        DEBUG_STORE_PASSWORD: ${{ secrets.DEBUG_STORE_PASSWORD }}
        DEBUG_KEY_ALIAS: ${{ secrets.DEBUG_KEY_ALIAS }}
        DEBUG_KEY_PASSWORD: ${{ secrets.DEBUG_KEY_PASSWORD }}
      run: ./gradlew assembleDebug --stacktrace

    - name: Name the debug APK after the commit
      if: github.actor != 'dependabot[bot]'
      run: |
        name="app-debug-$(echo "$BUILD_GIT_SHA" | cut -c1-7)"
        mv app/build/outputs/apk/debug/app-debug.apk "app/build/outputs/apk/debug/$name.apk"
        echo "DEBUG_APK_NAME=$name" >> "$GITHUB_ENV"
        echo "DEBUG_APK=app/build/outputs/apk/debug/$name.apk" >> "$GITHUB_ENV"

    - name: Check debug signing certificate
      if: github.actor != 'dependabot[bot]'
      env:
        EXPECTED_SHA256: ${{ vars.DEBUG_SIGNING_SHA256 }}
      run: |
        apksigner=$(find "$ANDROID_HOME/build-tools" -maxdepth 2 -name apksigner 2>/dev/null | sort -V | tail -1)
        if [ -z "$apksigner" ]; then
          echo "::warning::apksigner not found, cannot report which certificate signed the APK"
          exit 0
        fi
        if ! "$apksigner" verify --print-certs "$DEBUG_APK" > /tmp/certs.txt; then
          echo "::error::apksigner could not verify the debug APK"
          cat /tmp/certs.txt
          exit 1
        fi
        fingerprint=$(sed -n 's/.*certificate SHA-256 digest: //p' /tmp/certs.txt | head -1)
        if [ -z "$fingerprint" ]; then
          echo "::error::No signing certificate found in the debug APK"
          cat /tmp/certs.txt
          exit 1
        fi
        echo "Debug signing certificate SHA-256: $fingerprint"
        if [ -z "$EXPECTED_SHA256" ]; then
          echo "Pin it by setting the DEBUG_SIGNING_SHA256 repository variable to this value, and"
          echo "any future run signing with a different certificate fails here instead of shipping"
          echo "an APK that cannot be installed over the last one."
        elif [ "$fingerprint" != "$EXPECTED_SHA256" ]; then
          echo "::error::Signed with $fingerprint but DEBUG_SIGNING_SHA256 pins $EXPECTED_SHA256."
          echo "Installs over an earlier CI build would fail. Check the DEBUG_KEYSTORE_BASE64 secret."
          exit 1
        else
          echo "Matches the pinned DEBUG_SIGNING_SHA256."
        fi

    - name: Run tests
      run: ./gradlew testDebugUnitTest --stacktrace

    # testDebugUnitTest only covers the app module. The shared commonTest suite -- navigation,
    # geometry, heading, importers, all the logic both platforms share -- runs on the JVM through
    # this task, and went unrun by CI until now.
    - name: Run shared tests
      run: ./gradlew :shared:testAndroidHostTest --stacktrace

    - name: Upload debug APK
      if: github.actor != 'dependabot[bot]'
      uses: actions/upload-artifact@v7
      with:
        name: ${{ env.DEBUG_APK_NAME }}
        path: ${{ env.DEBUG_APK }}
        retention-days: 30
        archive: false

    - name: Upload test results
      if: always() && github.actor != 'dependabot[bot]'
      uses: actions/upload-artifact@v7
      with:
        name: test-results
        path: |
          app/build/reports/tests/
          shared/build/reports/tests/
        retention-days: 14

    - name: Cleanup secrets
      if: always()
      run: rm -f /tmp/debug.jks /tmp/certs.txt app/google-services.json local.properties
