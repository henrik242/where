name: Build Android

permissions:
  contents: read

on:
  push:
    branches: [ main, develop ]
    paths:
      - 'app/**'
      - 'shared/**'
      - 'gradle/**'
      - '*gradle*'
      - '.github/workflows/build-android.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'app/**'
      - 'shared/**'
      - 'gradle/**'
      - '*gradle*'
      - 'gradlew'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    environment: ${{ github.actor != 'dependabot[bot]' && 'production' || '' }}

    steps:
    - name: Checkout code
      uses: actions/checkout@v7
      with:
        fetch-depth: 0

    - name: Set up JDK 21
      uses: actions/setup-java@v5
      with:
        java-version: '21'
        distribution: 'temurin'

    - name: Set up Gradle
      uses: gradle/actions/setup-gradle@v6
      with:
        cache-provider: basic

    - name: Validate secrets
      if: github.actor != 'dependabot[bot]'
      run: |
        if [ -z "${{ secrets.TRACKING_HINT }}" ]; then
          echo "ERROR: TRACKING_HINT is not set in GitHub secrets"
          exit 1
        fi

    - name: Create local.properties
      run: |
        echo "sdk.dir=$ANDROID_HOME" > local.properties
        echo "TRACKING_HINT=${{ github.actor != 'dependabot[bot]' && secrets.TRACKING_HINT || 'dependabot-dummy-tracking-hint' }}" >> local.properties

    - name: Create google-services.json
      run: |
        if [ "${{ github.actor }}" = "dependabot[bot]" ]; then
          cp .github/dummy/google-services-dummy.json app/google-services.json
        else
          echo "${{ secrets.GOOGLE_SERVICES_JSON }}" | base64 -d > app/google-services.json
        fi

    - name: Decode debug keystore
      if: github.actor != 'dependabot[bot]'
      env:
        DEBUG_KEYSTORE_BASE64: ${{ secrets.DEBUG_KEYSTORE_BASE64 }}
      run: |
        if [ -z "$DEBUG_KEYSTORE_BASE64" ]; then
          echo "DEBUG_KEYSTORE_BASE64 not set, falling back to a generated debug keystore."
          echo "Installs over an earlier CI build will fail until the secret is added."
          exit 0
        fi
        echo "$DEBUG_KEYSTORE_BASE64" | base64 -d > /tmp/debug.jks

    - name: Build debug APK
      if: github.actor != 'dependabot[bot]'
      env:
        DEBUG_STORE_FILE: /tmp/debug.jks
        DEBUG_STORE_PASSWORD: ${{ secrets.DEBUG_STORE_PASSWORD }}
        DEBUG_KEY_ALIAS: ${{ secrets.DEBUG_KEY_ALIAS }}
        DEBUG_KEY_PASSWORD: ${{ secrets.DEBUG_KEY_PASSWORD }}
      run: ./gradlew assembleDebug --stacktrace

    - name: Run tests
      run: ./gradlew testDebugUnitTest --stacktrace

    - name: Upload debug APK
      if: github.actor != 'dependabot[bot]'
      uses: actions/upload-artifact@v7
      with:
        name: app-debug
        path: app/build/outputs/apk/debug/app-debug.apk
        retention-days: 30
        archive: false

    - name: Upload test results
      if: always() && github.actor != 'dependabot[bot]'
      uses: actions/upload-artifact@v7
      with:
        name: test-results
        path: app/build/reports/tests/
        retention-days: 14

    - name: Cleanup secrets
      if: always()
      run: rm -f /tmp/debug.jks app/google-services.json local.properties
