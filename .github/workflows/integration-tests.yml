name: Integration Tests

permissions:
  contents: read

on:
  schedule:
    - cron: '0 6 * * 1'  # Every Monday at 06:00 UTC
  workflow_dispatch:

# Resolve the interim forked maplibre-compose (0.19.0-where1) from the fork's GitHub Packages.
# A classic PAT with read:packages, stored as the MAPLIBRE_FORK_TOKEN secret (the built-in
# GITHUB_TOKEN cannot read another repo's packages). See settings.gradle.kts WhereForkPackages.
env:
  MAPLIBRE_FORK_USER: henrik242
  MAPLIBRE_FORK_TOKEN: ${{ secrets.MAPLIBRE_FORK_TOKEN }}

jobs:
  integration-tests:
    runs-on: ubuntu-latest
    environment: production

    steps:
    - name: Checkout code
      uses: actions/checkout@v7

    - name: Set up JDK 21
      uses: actions/setup-java@v6
      with:
        java-version: '21'
        distribution: 'temurin'

    - name: Set up Gradle
      uses: gradle/actions/setup-gradle@v6.3.0
      with:
        cache-provider: basic

    - name: Create local.properties
      run: |
        cat > local.properties <<EOF
        sdk.dir=$ANDROID_HOME
        TRACKING_HINT=${{ secrets.TRACKING_HINT }}
        EOF

    - name: Create google-services.json
      run: echo "${{ secrets.GOOGLE_SERVICES_JSON }}" | base64 -d > app/google-services.json

    - name: Run integration tests
      run: ./gradlew integrationTest --stacktrace

    - name: Upload test results
      if: always()
      uses: actions/upload-artifact@v7
      with:
        name: integration-test-results
        path: app/build/reports/tests/
        retention-days: 14
