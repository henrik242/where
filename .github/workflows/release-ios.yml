name: Release iOS

permissions:
  contents: write

on:
  workflow_dispatch:
    inputs:
      whats_new_en:
        description: "What's New (English)"
        required: true
        default: "Bug fixes and improvements."
      whats_new_no:
        description: "Hva er nytt (norsk)"
        required: true
        default: "Feilrettinger og forbedringer."
      submit_for_review:
        description: "Submit for review (uncheck to upload without releasing)"
        type: boolean
        default: true

concurrency:
  group: release-ios
  cancel-in-progress: false

jobs:
  release:
    runs-on: macos-26
    environment: production
    env:
      LANG: en_US.UTF-8
      LC_ALL: en_US.UTF-8

    steps:
    - name: Checkout code
      uses: actions/checkout@v7
      with:
        fetch-depth: 0

    - name: Validate secrets
      env:
        TRACKING_HINT: ${{ secrets.TRACKING_HINT }}
        GOOGLE_SERVICE_INFO_PLIST: ${{ secrets.GOOGLE_SERVICE_INFO_PLIST }}
        GOOGLE_SERVICE_INFO_DEBUG_PLIST: ${{ secrets.GOOGLE_SERVICE_INFO_DEBUG_PLIST }}
        GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        DISTRIBUTION_CERTIFICATE_BASE64: ${{ secrets.DISTRIBUTION_CERTIFICATE_BASE64 }}
        DISTRIBUTION_CERTIFICATE_PASSWORD: ${{ secrets.DISTRIBUTION_CERTIFICATE_PASSWORD }}
        PROVISIONING_PROFILE_BASE64: ${{ secrets.PROVISIONING_PROFILE_BASE64 }}
        ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
        ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        ASC_KEY_CONTENT: ${{ secrets.ASC_KEY_CONTENT }}
        ASC_CONTACT_FIRST_NAME: ${{ secrets.ASC_CONTACT_FIRST_NAME }}
        ASC_CONTACT_LAST_NAME: ${{ secrets.ASC_CONTACT_LAST_NAME }}
        ASC_CONTACT_PHONE: ${{ secrets.ASC_CONTACT_PHONE }}
        ASC_CONTACT_EMAIL: ${{ secrets.ASC_CONTACT_EMAIL }}
      run: |
        v=".github/verify-secret.sh"
        $v nonempty TRACKING_HINT
        $v base64 GOOGLE_SERVICE_INFO_PLIST
        $v base64 GOOGLE_SERVICE_INFO_DEBUG_PLIST
        $v json GOOGLE_SERVICES_JSON
        $v p12 DISTRIBUTION_CERTIFICATE_BASE64 "$DISTRIBUTION_CERTIFICATE_PASSWORD"
        $v mobileprovision PROVISIONING_PROFILE_BASE64
        $v nonempty ASC_KEY_ID
        $v nonempty ASC_ISSUER_ID
        $v p8 ASC_KEY_CONTENT
        $v nonempty ASC_CONTACT_FIRST_NAME
        $v nonempty ASC_CONTACT_LAST_NAME
        $v phone ASC_CONTACT_PHONE
        $v email ASC_CONTACT_EMAIL

    - name: Set up Ruby and fastlane
      uses: ruby/setup-ruby@v1
      with:
        ruby-version: '3.4'
        bundler-cache: true

    - name: Set up JDK 21
      uses: actions/setup-java@v5
      with:
        java-version: '21'
        distribution: 'temurin'

    - name: Set up Gradle
      uses: gradle/actions/setup-gradle@v6
      with:
        cache-provider: basic

    - name: Cache Konan
      uses: actions/cache@v6
      with:
        path: |
          /Users/runner/.konan/kotlin-native-prebuilt-*
          /Users/runner/.konan/dependencies
        key: ${{ runner.os }}-konan-${{ hashFiles('gradle/libs.versions.toml') }}
        restore-keys: |
          ${{ runner.os }}-konan-

    - name: Create local.properties
      env:
        TRACKING_HINT: ${{ secrets.TRACKING_HINT }}
      run: |
        echo "sdk.dir=$ANDROID_HOME" > local.properties
        echo "TRACKING_HINT=$TRACKING_HINT" >> local.properties

    - name: Create GoogleService-Info.plist
      env:
        GOOGLE_SERVICE_INFO_PLIST: ${{ secrets.GOOGLE_SERVICE_INFO_PLIST }}
        GOOGLE_SERVICE_INFO_DEBUG_PLIST: ${{ secrets.GOOGLE_SERVICE_INFO_DEBUG_PLIST }}
      run: |
        echo "$GOOGLE_SERVICE_INFO_PLIST" | base64 -d > iosApp/Where/GoogleService-Info.plist
        echo "$GOOGLE_SERVICE_INFO_DEBUG_PLIST" | base64 -d > iosApp/Where/GoogleService-debug-Info.plist

    - name: Create google-services.json
      env:
        GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
      run: echo "$GOOGLE_SERVICES_JSON" | base64 -d > app/google-services.json

    - name: Compute version
      id: version
      run: |
        COMMIT_COUNT=$(git rev-list --count HEAD)
        SHORT_SHA=$(git rev-parse --short HEAD)
        BUILD_DATE=$(date +%Y-%m-%d)
        echo "commit_count=$COMMIT_COUNT" >> "$GITHUB_OUTPUT"
        echo "tag=v$COMMIT_COUNT" >> "$GITHUB_OUTPUT"
        echo "Version: $COMMIT_COUNT ($SHORT_SHA, $BUILD_DATE)"

    - name: Update iOS version
      run: |
        cat > iosApp/Where/Generated.xcconfig << EOF
        CURRENT_PROJECT_VERSION = ${{ steps.version.outputs.commit_count }}
        MARKETING_VERSION = 1.0.${{ steps.version.outputs.commit_count }}
        EOF

    - name: Run tests
      run: ./gradlew testDebugUnitTest

    - name: Upload test results
      if: always()
      uses: actions/upload-artifact@v7
      with:
        name: test-results
        path: app/build/reports/tests/
        retention-days: 14

    - name: Compile iOS test sources
      run: ./gradlew :shared:compileTestKotlinIosSimulatorArm64

    - name: Build shared framework
      run: ./gradlew :shared:linkReleaseFrameworkIosArm64

    - name: Decode signing assets
      env:
        DISTRIBUTION_CERTIFICATE_BASE64: ${{ secrets.DISTRIBUTION_CERTIFICATE_BASE64 }}
        PROVISIONING_PROFILE_BASE64: ${{ secrets.PROVISIONING_PROFILE_BASE64 }}
      run: |
        CERTIFICATE_PATH=$RUNNER_TEMP/distribution.p12
        PROFILE_PATH=$RUNNER_TEMP/distribution.mobileprovision

        echo "$DISTRIBUTION_CERTIFICATE_BASE64" | base64 -d > "$CERTIFICATE_PATH"
        echo "$PROVISIONING_PROFILE_BASE64" | base64 -d > "$PROFILE_PATH"

        # fastlane imports the cert and installs the profile; it just needs the profile name
        PROFILE_PLIST=$(/usr/bin/security cms -D -i "$PROFILE_PATH")
        PROFILE_NAME=$(/usr/libexec/PlistBuddy -c "Print Name" /dev/stdin <<< "$PROFILE_PLIST")
        echo "PROFILE_NAME=$PROFILE_NAME" >> "$GITHUB_ENV"

    - name: Build and sign IPA
      env:
        OUTPUT_DIR: ${{ runner.temp }}/export
        PROFILE_NAME: ${{ env.PROFILE_NAME }}
        DISTRIBUTION_CERTIFICATE_PATH: ${{ runner.temp }}/distribution.p12
        DISTRIBUTION_CERTIFICATE_PASSWORD: ${{ secrets.DISTRIBUTION_CERTIFICATE_PASSWORD }}
        PROVISIONING_PROFILE_PATH: ${{ runner.temp }}/distribution.mobileprovision
        FASTLANE_XCODEBUILD_SETTINGS_TIMEOUT: 60
      run: bundle exec fastlane ios build

    - name: Upload IPA
      uses: actions/upload-artifact@v7
      with:
        name: release-ipa
        path: ${{ runner.temp }}/export/Where.ipa
        retention-days: 90

    - name: Upload to App Store Connect
      env:
        ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
        ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        ASC_KEY_CONTENT: ${{ secrets.ASC_KEY_CONTENT }}
        ASC_KEY_PATH: ${{ runner.temp }}/AuthKey.p8
        IPA_PATH: ${{ runner.temp }}/export/Where.ipa
        ASC_CONTACT_FIRST_NAME: ${{ secrets.ASC_CONTACT_FIRST_NAME }}
        ASC_CONTACT_LAST_NAME: ${{ secrets.ASC_CONTACT_LAST_NAME }}
        ASC_CONTACT_PHONE: ${{ secrets.ASC_CONTACT_PHONE }}
        ASC_CONTACT_EMAIL: ${{ secrets.ASC_CONTACT_EMAIL }}
        WHATS_NEW_EN: ${{ github.event.inputs.whats_new_en }}
        WHATS_NEW_NO: ${{ github.event.inputs.whats_new_no }}
        SUBMIT_FOR_REVIEW: ${{ inputs.submit_for_review }}
      run: |
        echo "$ASC_KEY_CONTENT" | base64 -d > "$ASC_KEY_PATH"
        bundle exec fastlane ios deploy

    - name: Create version tag and release
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        VERSION_TAG="${{ steps.version.outputs.tag }}"
        echo "Tagging $VERSION_TAG"
        git tag "$VERSION_TAG" 2>/dev/null || true
        git push origin "$VERSION_TAG" 2>/dev/null || true
        gh release view "$VERSION_TAG" &>/dev/null && \
          gh release upload "$VERSION_TAG" "${{ runner.temp }}/export/Where.ipa" --clobber || \
          gh release create "$VERSION_TAG" \
            --target "$(git rev-parse HEAD)" \
            --title "$VERSION_TAG" \
            --notes "Release $VERSION_TAG" \
            "${{ runner.temp }}/export/Where.ipa"

    - name: Cleanup secrets
      if: always()
      run: |
        security delete-keychain fastlane_tmp_keychain 2>/dev/null || true
        rm -f "$RUNNER_TEMP/distribution.p12" "$RUNNER_TEMP/distribution.mobileprovision" "$RUNNER_TEMP/AuthKey.p8"
        rm -f local.properties
