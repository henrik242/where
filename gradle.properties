org.gradle.jvmargs=-Xmx8192m -XX:+HeapDumpOnOutOfMemoryError -XX:+UseParallelGC -XX:MaxMetaspaceSize=1024m
org.gradle.caching=true
org.gradle.configuration-cache=true
org.gradle.parallel=true

# Enabled parallel sync for Gradle 9.4+
org.gradle.tooling.parallel=true

# Incremental compilation of klibs (Beta in Kotlin 2.4.20); cuts iOS debug build times.
kotlin.incremental.native=true
